name: Fonts

on:
  push:
    branches: [main, "sg/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash sources/build.sh
      - run: python3 tools/check.py
      - run: python3 tools/proof.py
      - uses: fonttools/setup-fontspector@d53404291dc78a5a41cf76ea48e1d13a731fb812
        with:
          version: 1.9.0
      - run: |
          for style in Running Satin Applique Plain Woven Chain; do
            fontspector -p googlefonts --skip-network -x googlefonts/repo/dirname_matches_nameid_1 -l fail --succinct fonts/ttf/Threadline${style}-*.ttf
          done
      - run: git diff --exit-code -- fonts/ttf fonts/webfonts sources/ufo specimens

  release:
    if: github.repository == 'chaosmos-studio/threadline' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: threadline-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="v$(python3 -c 'from tools.build import VERSION; print(VERSION)')"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid font version: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            if ! git diff --quiet "$tag" HEAD -- fonts sources OFL.txt AUTHORS.txt; then
              echo "Font files changed after $tag; bump VERSION before releasing" >&2
              exit 1
            fi
            if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
              echo "state=done" >> "$GITHUB_OUTPUT"
            else
              echo "state=resume" >> "$GITHUB_OUTPUT"
            fi
          else
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
            if [[ -n "$latest" && "$latest" != "$tag" && "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
              echo "$tag must be newer than $latest" >&2
              exit 1
            fi
            echo "state=new" >> "$GITHUB_OUTPUT"
          fi
      - name: Package release
        if: steps.version.outputs.state != 'done'
        run: |
          python3 tools/check.py
          python3 tools/package.py "${{ steps.version.outputs.tag }}"
      - name: Tag release
        if: steps.version.outputs.state == 'new'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Publish release
        if: steps.version.outputs.state != 'done'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/SHA256SUMS fonts/ttf/*.ttf fonts/webfonts/*.woff2 --clobber
          else
            gh release create "$tag" dist/*.zip dist/SHA256SUMS fonts/ttf/*.ttf fonts/webfonts/*.woff2 --verify-tag --draft --generate-notes
          fi
          gh release edit "$tag" --draft=false
